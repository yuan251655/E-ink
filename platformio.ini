[platformio]
default_envs = photopainter_esp32s3
src_dir = main

[env:photopainter_esp32s3]
; Product source is based on ESP-IDF 5 APIs. PlatformIO 7 upgrades to IDF 6
; (including MbedTLS 4), which is incompatible with the upstream audio stack.
platform = espressif32@6.13.0
framework = espidf
board = esp32-s3-devkitc-1
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.flash_size = 16MB
# The product uses a 16 MB module and the checked-in single large-app table.
# Without this explicit PlatformIO override, its generic DevKitC board profile
# falls back to a 1 MB application slot and rejects a valid product firmware.
board_build.partitions = partitions/v2/16m_dev_large_app.csv
board_upload.flash_size = 16MB
monitor_speed = 115200

# The official ESP-IDF project owns its top-level CMakeLists.txt, main/
# component and components/ tree. PlatformIO is used only as the familiar
# build/upload/monitor frontend; no official source file is changed here.
